<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Will you be my Valentine?</title>

  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Love+Light&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg1: #ffccd5;
      --bg2: #fff0f3;
      --card: #ffffffeb;
      --yes: #ff4d6d;
      --yesHover: #c9184a;
      --momoh-color: #ff0054;
      --heart: #ff4d6d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family: 'Dancing Script', cursive, system-ui, sans-serif;
      overflow: hidden;
      padding: 16px;
      position: relative;
    }

    /* FLOATING HEARTS BACKGROUND */
    .floating-hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .heart-particle {
      position: absolute;
      color: var(--heart);
      opacity: 0.3;
      animation: floatUp 6s linear infinite;
      font-size: 20px;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      20% { opacity: 0.3; }
      100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .card {
      width: min(720px, 92vw);
      padding: 30px 24px;
      background: var(--card);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 20px 70px rgba(0,0,0,.12);
      position: relative;
      z-index: 1;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    /* LOVE CAT GIF STYLING */
    .cat-art {
      width: min(200px, 60vw);
      margin: 0 auto 15px;
      display: block;
      border-radius: 15px;
    }

    .momoh-text {
      font-family: 'Love Light', cursive;
      color: var(--momoh-color);
      font-size: 1.4em;
      display: inline-block;
      vertical-align: middle;
      filter: drop-shadow(0 0 5px rgba(255, 0, 84, 0.2));
    }

    h1 {
      font-size: clamp(26px, 4.5vw, 48px);
      margin: 12px 0 18px;
      font-weight: 700;
      line-height: 1.2;
    }

    .button-zone {
      position: relative;
      width: min(520px, 92%);
      height: 160px;
      margin: 20px auto 0;
      touch-action: none;
    }

    button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 18px 28px;
      font-size: 20px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.12);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .15s cubic-bezier(0.175, 0.885, 0.32, 1.275), background .15s ease;
    }

    #yesBtn {
      left: 15%;
      background: var(--yes);
      color: #fff;
    }
    #yesBtn:hover { transform: translateY(-50%) scale(1.05); background: var(--yesHover); }

    #noBtn {
      left: 65%;
      background: #f1f3f5;
      color: #343a40;
    }

    .hint {
      margin-top: 15px;
      font-size: 14px;
      opacity: .8;
      font-style: italic;
    }

    .result {
      display: none;
      margin-top: 25px;
      animation: pop .4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .result h2 {
      font-size: clamp(32px, 5vw, 52px);
      margin: 15px 0;
      color: var(--momoh-color);
    }

    /* Reliable GIF display */
    .love-gif {
      width: min(400px, 85vw);
      border-radius: 20px;
      margin: 0 auto;
      display: block;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    @keyframes pop {
      from { transform: scale(.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body>
  <div class="floating-hearts" id="floatingHearts"></div>
  <canvas id="confettiCanvas"></canvas>

  <main class="card">
    <!-- Adorable Love Cat GIF (Peach & Goma) -->
    <img
      src="https://media.tenor.com/eC0FtYrtP_gAAAAM/happy-valentines-day-winnie-the-pooh.gif"
      alt="Love Cat"
      class="cat-art"
    />

    <h1><span class="momoh-text">MOMOH</span>, will you be my valentine?</h1>

    <section class="button-zone" id="zone">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </section>

    <!-- HINT -->
    <div class="hint" id="hint">“No” seems a bit shy </div>

    <section class="result" id="result">
      <h2>YAY! 🎉</h2>
      <!-- Reliable GIF from Giphy (I Wuv You Bear) -->
      <img
        class="love-gif"
        src="https://media3.giphy.com/media/v1.Y2lkPTZjMDliOTUyOXg3cHBiMXIzZ3FscTRnc2xrYjJweGtrOXgxNHc3OGR5dHgwYzZxYiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/NxC8VtyxqhMtpLoEEN/200w.gif"
        alt="I Wuv You Bear"
      />
    </section>
  </main>

  <script>
    // Create floating hearts particles
    const floatingHearts = document.getElementById('floatingHearts');
    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart-particle';
      heart.innerHTML = '❤️';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
      heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
      floatingHearts.appendChild(heart);
      setTimeout(() => heart.remove(), 7000);
    }
    setInterval(createHeart, 500);

    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const hint = document.getElementById("hint");

    /* ---------- CONFETTI ---------- */
    const confettiCanvas = document.getElementById("confettiCanvas");

    function resizeConfettiCanvas() {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      confettiCanvas.width = Math.floor(window.innerWidth * dpr);
      confettiCanvas.height = Math.floor(window.innerHeight * dpr);
      confettiCanvas.style.width = "100vw";
      confettiCanvas.style.height = "100vh";
    }

    resizeConfettiCanvas();
    window.addEventListener("resize", resizeConfettiCanvas);
    window.addEventListener("orientationchange", () => setTimeout(resizeConfettiCanvas, 150));

    const confettiInstance = confetti.create(confettiCanvas, {
      resize: false,
      useWorker: true
    });

    function fullScreenConfetti() {
      const end = Date.now() + 2000;

      (function frame() {
        confettiInstance({
          particleCount: 15,
          spread: 80,
          startVelocity: 50,
          ticks: 200,
          origin: { x: Math.random(), y: Math.random() * 0.4 }
        });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();

      setTimeout(() => {
        confettiInstance({
          particleCount: 400,
          spread: 160,
          startVelocity: 70,
          ticks: 250,
          origin: { x: 0.5, y: 0.5 }
        });
      }, 300);
    }

    /* ---------- YES BUTTON GROWS ---------- */
    let yesScale = 1;
    function growYes() {
      yesScale = Math.min(2.5, yesScale + 0.12);
      yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
    }

    /* ---------- NO BUTTON RUNS AWAY ---------- */
    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    function moveNo(px, py) {
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      let dx = (b.left + b.width / 2) - px;
      let dy = (b.top + b.height / 2) - py;
      let mag = Math.hypot(dx, dy) || 1;
      dx /= mag;
      dy /= mag;

      let newLeft = (b.left - z.left) + dx * 160;
      let newTop  = (b.top - z.top) + dy * 160;

      newLeft = clamp(newLeft, 0, z.width - b.width);
      newTop  = clamp(newTop, 0, z.height - b.height);

      noBtn.style.left = newLeft + "px";
      noBtn.style.top = newTop + "px";
      noBtn.style.transform = "none";

      growYes();
    }

    zone.addEventListener("pointermove", e => {
      const b = noBtn.getBoundingClientRect();
      const d = Math.hypot(
        (b.left + b.width / 2) - e.clientX,
        (b.top + b.height / 2) - e.clientY
      );
      if (d < 150) moveNo(e.clientX, e.clientY);
    });

    noBtn.addEventListener("click", e => e.preventDefault());

    /* ---------- YES CLICK ---------- */
    yesBtn.addEventListener("click", () => {
      zone.style.display = "none";
      hint.style.display = "none";
      result.style.display = "block";
      resizeConfettiCanvas();
      fullScreenConfetti();
    });
  </script>
</body>
</html>
